[package]
name = "surw"
version = "0.1.0"
edition = "2021"
description = "HyprSur wallpaper daemon: static images, time-stretched videos, long transitions and macOS-style dynamic wallpapers"
license = "MIT"

[dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "rayon"] }
chrono = "0.4"
anyhow = "1"
plist = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2
