<svg width="1024" height="1025" viewBox="0 0 1024 1025" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
<!-- Иконка Календаря для дока hyprSur. Док сам подставляет:
     Вт — день недели (WED / СР), 10 — число, {MONTH} — месяц.
     Язык берётся из AppleLanguages. Можно двигать x/y, менять шрифт и цвета. -->
<rect width="1024" height="1024" rx="264.943" fill="white"/>
<text id="weekday" x="514.5" y="274.5" text-anchor="middle"
      font-family="-apple-system, SF Pro Display, Inter, Helvetica Neue, Arial, sans-serif" font-weight="600"
      font-size="207" fill="#FB3634">Вт</text>
<text id="day" x="512" y="865" text-anchor="middle"
      font-family="-apple-system, SF Pro Display, Inter, Helvetica Neue, Arial, sans-serif" font-weight="400"
      font-size="672" fill="#1F1D1E" letter-spacing="-10">10</text>
</svg>
